services:
  hnr-monitor:
    image: chdbits-hnr-monitor:0.1.4
    container_name: chdbits-hnr-monitor
    restart: unless-stopped
    environment:
      # Required
      HNR_USER_ID: ${HNR_USER_ID:?set HNR_USER_ID}
      CHDBITS_COOKIE: ${CHDBITS_COOKIE:?set CHDBITS_COOKIE}

      # Monitor behavior
      HNR_CHECK_INTERVAL_MINUTES: ${HNR_CHECK_INTERVAL_MINUTES:-30}
      HNR_STALLED_AFTER_HOURS: ${HNR_STALLED_AFTER_HOURS:-24}
      HNR_NOTIFY_REPEAT_HOURS: ${HNR_NOTIFY_REPEAT_HOURS:-12}
      HNR_TIMEZONE: ${HNR_TIMEZONE:-Asia/Shanghai}
      TZ: ${HNR_TIMEZONE:-Asia/Shanghai}
      HNR_STATE_PATH: /data/hnr-monitor.sqlite3

      # Email notification
      HNR_EMAIL_ENABLED: ${HNR_EMAIL_ENABLED:-false}
      HNR_SMTP_HOST: ${HNR_SMTP_HOST:-}
      HNR_SMTP_PORT: ${HNR_SMTP_PORT:-465}
      HNR_SMTP_USE_SSL: ${HNR_SMTP_USE_SSL:-true}
      HNR_SMTP_STARTTLS: ${HNR_SMTP_STARTTLS:-false}
      HNR_SMTP_USERNAME: ${HNR_SMTP_USERNAME:-}
      HNR_SMTP_PASSWORD: ${HNR_SMTP_PASSWORD:-}
      HNR_EMAIL_FROM: ${HNR_EMAIL_FROM:-}
      HNR_EMAIL_TO: ${HNR_EMAIL_TO:-}

      # Optional webhook notification
      HNR_WEBHOOK_ENABLED: ${HNR_WEBHOOK_ENABLED:-false}
      HNR_WEBHOOK_URL: ${HNR_WEBHOOK_URL:-}
    volumes:
      - ./data:/data

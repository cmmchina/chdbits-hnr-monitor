services:
  hnr-monitor:
    build: .
    image: chdbits-hnr-monitor:0.1.6
    container_name: chdbits-hnr-monitor
    restart: unless-stopped
    environment:
      # Fill these in on your host, or use an .env file that is not committed.
      CHDBITS_COOKIE: ${CHDBITS_COOKIE:?set CHDBITS_COOKIE}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      HNR_WEBHOOK_URL: ${HNR_WEBHOOK_URL:-}
      HNR_WECHAT_WEBHOOK_URL: ${HNR_WECHAT_WEBHOOK_URL:-}
      HNR_QQ_ONEBOT_URL: ${HNR_QQ_ONEBOT_URL:-}
      HNR_QQ_ONEBOT_TOKEN: ${HNR_QQ_ONEBOT_TOKEN:-}
    volumes:
      - ./config.toml:/config/config.toml:ro
      - ./data:/data

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chdbits-hnr-monitor"
version = "0.1.6"
description = "Docker-friendly H&R progress monitor for private tracker pages."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "CHDBits H&R Monitor Contributors" }
]
dependencies = []

[project.scripts]
hnr-monitor = "hnr_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
